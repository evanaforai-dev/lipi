<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- App tile -->
  <rect width="128" height="128" rx="28" fill="#0D99FF"/>

  <!-- A frame (the container) -->
  <rect x="30" y="34" width="50" height="60" rx="9" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.85"/>

  <!-- Fitting text lines -->
  <rect x="41" y="49" width="30" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="41" y="63" width="22" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- Localized line that overflows the frame (the pressure) -->
  <rect x="41" y="77" width="58" height="6" rx="3" fill="#FFFFFF"/>
  <!-- Overflow highlight where it breaks out -->
  <rect x="80" y="72" width="24" height="16" rx="4" fill="#FF9500"/>
  <rect x="84" y="77" width="16" height="6" rx="3" fill="#FFFFFF"/>
</svg>
